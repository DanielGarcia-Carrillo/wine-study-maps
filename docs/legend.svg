<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 576" width="640" height="576">
<style>
  text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .ti { font-size: 22px; font-weight: 700; fill: #2b2b33; }
  .label { font-size: 14px; fill: #2b2b33; }
  .city { font-size: 14px; fill: #6f6f79; }
  .country { font-size: 12px; font-weight: 600; letter-spacing: 2px; fill: #a39b8e; }
</style>
<rect width="100%" height="100%" fill="#f6f3ec"/>
<text x="24" y="36" class="ti">Map legend</text>
<g transform="translate(24 56)"><rect x="4" y="8" width="84" height="44" fill="#4d5a6a" fill-opacity="0.1" stroke="#4d5a6a" stroke-width="2" stroke-opacity="0.85"/><text x="108" y="35" class="label">The region the map is about: a grey border over a light grey wash</text></g>
<g transform="translate(24 120)"><rect x="4" y="8" width="84" height="44" fill="#7a1f2b" fill-opacity="0.17" stroke="#7a1f2b" stroke-width="2" stroke-opacity="0.85"/><text x="108" y="35" class="label">A wine region, each in its own colour</text></g>
<g transform="translate(24 184)"><rect x="4" y="8" width="84" height="44" fill="#7a1f2b" fill-opacity="0.17" stroke="#7a1f2b" stroke-width="2" stroke-opacity="0.85"/><rect x="18" y="16" width="56" height="28" fill="#7a1f2b" fill-opacity="0.38" stroke="#7a1f2b" stroke-width="2" stroke-opacity="0.85"/><rect x="34" y="23" width="24" height="14" fill="#7a1f2b" fill-opacity="0.6" stroke="#7a1f2b" stroke-width="2" stroke-opacity="0.85"/><text x="108" y="35" class="label">An area inside another: a darker tone of its parent, darker again a level deeper</text></g>
<g transform="translate(24 248)"><defs><pattern id="legend-stripes" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="4" height="8" fill="#7a1f2b" fill-opacity="0.17"/><rect x="4" width="4" height="8" fill="#2f7d8c" fill-opacity="0.17"/></pattern></defs><rect x="4" y="8" width="54" height="44" fill="#7a1f2b" fill-opacity="0.17"/><rect x="34" y="8" width="54" height="44" fill="#2f7d8c" fill-opacity="0.17"/><rect x="34" y="8" width="24" height="44" fill="#f6f3ec"/><rect x="34" y="8" width="24" height="44" fill="url(#legend-stripes)"/><rect x="4" y="8" width="54" height="44" fill="none" stroke="#7a1f2b" stroke-width="2" stroke-opacity="0.85"/><rect x="34" y="8" width="54" height="44" fill="none" stroke="#266470" stroke-width="2" stroke-opacity="0.85"/><text x="108" y="35" class="label">Two areas that overlap without either containing the other: stripes of both</text></g>
<g transform="translate(24 312)"><rect x="4" y="8" width="42" height="44" fill="#7a1f2b" fill-opacity="0.17" stroke="#7a1f2b" stroke-width="2" stroke-opacity="0.85"/><rect x="46" y="8" width="42" height="44" fill="#2f7d8c" fill-opacity="0.17" stroke="#266470" stroke-width="2" stroke-opacity="0.85"/><rect x="26" y="18" width="20" height="24" fill="#7a1f2b" fill-opacity="0.38"/><rect x="46" y="18" width="20" height="24" fill="#2f7d8c" fill-opacity="0.38"/><rect x="26" y="18" width="40" height="24" fill="none" stroke="#4d5a6a" stroke-width="2" stroke-opacity="0.85"/><text x="108" y="35" class="label">An area across two others (Los Carneros): each side in that parent's tone</text></g>
<g transform="translate(24 376)"><circle cx="46" cy="30" r="20" fill="#7a1f2b" fill-opacity="0.17" stroke="#7a1f2b" stroke-width="1" stroke-opacity="0.5"/><circle cx="46" cy="30" r="3.4" fill="#7a1f2b" stroke="#fff" stroke-width="1.4"/><text x="108" y="35" class="label">A region with no mapped boundary: its position and rough size only</text></g>
<g transform="translate(24 440)"><circle cx="16" cy="30" r="2.4" fill="#6f6f79"/><text x="24" y="34.7" class="city">City</text><text x="108" y="35" class="label">A city in the map's own country, for orientation</text></g>
<g transform="translate(24 504)"><text x="46" y="34.0" class="country" text-anchor="middle">SPAIN</text><text x="108" y="35" class="label">A neighbouring country, named in place of its cities</text></g>
</svg>
