name: Quality
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.11.3'
          enable-cache: false
      - name: Install native rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libcairo2 fonts-liberation
      - name: Install locked Python dependencies
        run: uv sync --locked --group dev
      - name: Run the local quality command unchanged
        run: uv run --locked --group dev python scripts/quality.py
