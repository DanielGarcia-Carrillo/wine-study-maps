[project]
name = "wset2-maps"
version = "0.1.0"
description = "Standalone wine region geography and static maps"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
  "PyYAML==6.0.3",
  "Pillow==12.3.0",
  "CairoSVG==2.9.1",
  "pyshp==3.1.6",
  "pydantic==2.14.1",
  "typing-extensions==4.16.0",
]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "ruff==0.17.3",
    "types-pyyaml==6.0.12.20260906",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["scripts", "tests", "typings"]
mypy_path = ["scripts", "typings"]
